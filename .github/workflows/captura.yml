name: captura-bicis
on:
  schedule:
    - cron: "*/15 * * * *"      # cada 15 min (UTC). GitHub puede retrasar o saltarse alguna ejecucion en horas de carga
  workflow_dispatch: {}          # boton "Run workflow" para probar a mano
permissions:
  contents: write
concurrency:
  group: captura
  cancel-in-progress: false
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python captura.py
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "datos $(TZ=Europe/Madrid date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
